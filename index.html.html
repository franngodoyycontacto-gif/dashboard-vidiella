<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mercado Vidiella</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lato', sans-serif; background: #0f1f12; color: #e8f0e0; min-height: 100vh; padding: 16px; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 20px; border-bottom: 1px solid #2a4a2d; margin-bottom: 20px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-icon { font-size: 28px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 20px; color: white; }
  .header p { font-size: 11px; color: #6a9a5a; letter-spacing: 1px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4aff6a; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .fecha { font-size: 12px; color: #6a9a5a; text-align: right; }

  /* MÉTRICAS PRINCIPALES */
  .metricas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .metrica { background: #1a3a1f; border-radius: 10px; padding: 14px; border: 1px solid #2a4a2d; }
  .metrica-num { font-size: 28px; font-weight: 700; color: white; line-height: 1; }
  .metrica-label { font-size: 11px; color: #6a9a5a; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .metrica-sub { font-size: 11px; color: #4a7c3f; margin-top: 2px; }
  .metrica.verde .metrica-num { color: #4aff6a; }
  .metrica.amarillo .metrica-num { color: #ffd700; }
  .metrica.rojo .metrica-num { color: #ff6b6b; }
  .metrica.azul .metrica-num { color: #6bb5ff; }

  /* SECCIONES */
  .seccion { background: #1a3a1f; border-radius: 10px; padding: 16px; margin-bottom: 12px; border: 1px solid #2a4a2d; }
  .seccion-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #6a9a5a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* ALERTAS */
  .alerta { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
  .alerta:last-child { margin-bottom: 0; }
  .alerta.roja { background: #3a1a1a; border: 1px solid #ff4444; }
  .alerta.amarilla { background: #3a3a1a; border: 1px solid #ffd700; }
  .alerta.verde { background: #1a3a1a; border: 1px solid #4aff6a; }
  .alerta-icon { font-size: 18px; flex-shrink: 0; }
  .alerta-body { flex: 1; }
  .alerta-title { font-size: 13px; font-weight: 700; color: white; }
  .alerta-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

  /* LISTA */
  .lista-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a4a2d; }
  .lista-item:last-child { border-bottom: none; }
  .lista-nombre { font-size: 13px; color: white; }
  .lista-sub { font-size: 11px; color: #6a9a5a; }
  .lista-valor { font-size: 13px; font-weight: 700; color: #4aff6a; }
  .lista-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
  .badge-verde { background: #1a4a1a; color: #4aff6a; }
  .badge-rojo { background: #4a1a1a; color: #ff6b6b; }
  .badge-amarillo { background: #4a4a1a; color: #ffd700; }

  /* BARRA DE PROGRESO */
  .barra-wrap { margin-top: 6px; }
  .barra-label { display: flex; justify-content: space-between; font-size: 11px; color: #6a9a5a; margin-bottom: 4px; }
  .barra { height: 6px; background: #0f1f12; border-radius: 3px; overflow: hidden; }
  .barra-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4a7c3f, #4aff6a); transition: width 0.5s; }

  /* BOTÓN REFRESH */
  .btn-refresh { background: #2a4a2d; border: none; color: #8fbc6a; padding: 8px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: 'Lato', sans-serif; }
  .btn-refresh:hover { background: #3a5a3d; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: #6a9a5a; font-size: 14px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 20px; color: #4a6a4a; font-size: 13px; }

  @media (max-width: 400px) {
    .metricas { grid-template-columns: 1fr 1fr; }
    .metrica-num { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🌿</div>
    <div>
      <h1>Mercado Vidiella</h1>
      <p>Dashboard personal</p>
    </div>
  </div>
  <div style="text-align:right;">
    <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-bottom:4px;">
      <div class="live-dot"></div>
      <span style="font-size:11px;color:#4aff6a;">En vivo</span>
    </div>
    <div class="fecha" id="fecha-hora">--</div>
  </div>
</div>

<div id="contenido">
  <div class="loading">🌿 Cargando datos...</div>
</div>

<script>
const SUPABASE_URL = 'https://ggtaduaoremvvkvgandy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_o661KMq1t9_Sz9NKsrUvaA_R_V3J84y';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Actualizar fecha y hora
function actualizarHora() {
  const ahora = new Date();
  document.getElementById('fecha-hora').textContent = ahora.toLocaleString('es-UY', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}
actualizarHora();
setInterval(actualizarHora, 60000);

// Formatear pesos uruguayos
function formatPesos(n) {
  if (!n || n === 0) return '$0';
  return '$' + Math.round(n).toLocaleString('es-UY');
}

// Días de la semana
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const hoy = DIAS[new Date().getDay()];

async function cargarDashboard() {
  try {
    const hoyStr = new Date().toISOString().split('T')[0];
    const hace7dias = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
    const hace30dias = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

    // ── QUERIES PARALELAS ──
    const [
      { data: clientes },
      { data: pedidosHoy },
      { data: pedidosMes },
      { data: clientesNuevosHoy },
      { data: clientesSinComprar },
      { data: topProductos },
      { data: ultimosPedidos }
    ] = await Promise.all([
      db.from('clientes').select('id, nombre, telefono, creado_en, ultima_compra_en, gasto_total, canal_preferido, dia_preferido').eq('activo', true),
      db.from('pedidos').select('id, total, canal, creado_en').gte('creado_en', hoyStr),
      db.from('pedidos').select('id, total, canal, creado_en').gte('creado_en', hace30dias),
      db.from('clientes').select('id').gte('creado_en', hoyStr),
      db.from('clientes').select('id, nombre, telefono, ultima_compra_en').eq('activo', true).lt('ultima_compra_en', hace7dias).not('ultima_compra_en', 'is', null).order('ultima_compra_en', { ascending: true }).limit(5),
      db.from('pedido_items').select('cantidad, precio_unit, productos(nombre)').limit(200),
      db.from('pedidos').select('id, total, canal, creado_en, clientes(nombre)').order('creado_en', { ascending: false }).limit(5)
    ]);

    // ── CÁLCULOS ──
    const totalClientes = clientes?.length || 0;
    const clientesNuevosHoyN = clientesNuevosHoy?.length || 0;
    const clientesActivosSemana = clientes?.filter(c =>
      c.ultima_compra_en && new Date(c.ultima_compra_en) > new Date(hace7dias)
    ).length || 0;

    const facturacionHoy = pedidosHoy?.reduce((s, p) => s + (p.total || 0), 0) || 0;
    const pedidosHoyN = pedidosHoy?.length || 0;
    const ticketPromHoy = pedidosHoyN > 0 ? facturacionHoy / pedidosHoyN : 0;

    const facturacionMes = pedidosMes?.reduce((s, p) => s + (p.total || 0), 0) || 0;
    const pedidosMesN = pedidosMes?.length || 0;

    const pedidosWpp = pedidosMes?.filter(p => p.canal === 'whatsapp').length || 0;
    const pedidosLocal = pedidosMes?.filter(p => p.canal === 'local').length || 0;
    const pctWpp = pedidosMesN > 0 ? Math.round(pedidosWpp / pedidosMesN * 100) : 0;

    const clientesSinComprarN = clientesSinComprar?.length || 0;

    // Top productos
    const conteoProductos = {};
    topProductos?.forEach(item => {
      const nombre = item.productos?.nombre;
      if (nombre) {
        conteoProductos[nombre] = (conteoProductos[nombre] || 0) + (item.cantidad || 0);
      }
    });
    const topProd = Object.entries(conteoProductos)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);

    // ── RENDER ──
    document.getElementById('contenido').innerHTML = `

      <!-- MÉTRICAS PRINCIPALES -->
      <div class="metricas">
        <div class="metrica verde">
          <div class="metrica-num">${formatPesos(facturacionHoy)}</div>
          <div class="metrica-label">Facturado hoy</div>
          <div class="metrica-sub">${pedidosHoyN} pedido${pedidosHoyN !== 1 ? 's' : ''}</div>
        </div>
        <div class="metrica amarillo">
          <div class="metrica-num">${clientesNuevosHoyN}</div>
          <div class="metrica-label">Clientes nuevos hoy</div>
          <div class="metrica-sub">${totalClientes} total registrados</div>
        </div>
        <div class="metrica azul">
          <div class="metrica-num">${formatPesos(ticketPromHoy)}</div>
          <div class="metrica-label">Ticket promedio hoy</div>
          <div class="metrica-sub">${formatPesos(facturacionMes)} este mes</div>
        </div>
        <div class="metrica ${clientesSinComprarN > 0 ? 'rojo' : 'verde'}">
          <div class="metrica-num">${clientesSinComprarN}</div>
          <div class="metrica-label">Para reactivar</div>
          <div class="metrica-sub">Sin comprar +7 días</div>
        </div>
      </div>

      <!-- ALERTAS -->
      ${clientesSinComprarN > 0 || clientesActivosSemana === 0 ? `
      <div class="seccion">
        <div class="seccion-title">🚨 Alertas</div>
        ${clientesSinComprarN > 0 ? `
        <div class="alerta roja">
          <div class="alerta-icon">⚠️</div>
          <div class="alerta-body">
            <div class="alerta-title">${clientesSinComprarN} cliente${clientesSinComprarN !== 1 ? 's' : ''} sin comprar hace +7 días</div>
            <div class="alerta-sub">Candidatos para remarketing</div>
          </div>
        </div>` : ''}
        ${pedidosHoyN === 0 ? `
        <div class="alerta amarilla">
          <div class="alerta-icon">📊</div>
          <div class="alerta-body">
            <div class="alerta-title">Sin pedidos registrados hoy todavía</div>
            <div class="alerta-sub">Recordá cargar las ventas del día</div>
          </div>
        </div>` : ''}
      </div>` : ''}

      <!-- CANAL DE VENTAS -->
      <div class="seccion">
        <div class="seccion-title">📊 Canal de ventas — este mes</div>
        <div class="barra-wrap">
          <div class="barra-label">
            <span>💬 WhatsApp (${pedidosWpp} pedidos)</span>
            <span>${pctWpp}%</span>
          </div>
          <div class="barra"><div class="barra-fill" style="width:${pctWpp}%"></div></div>
        </div>
        <div class="barra-wrap" style="margin-top:10px;">
          <div class="barra-label">
            <span>🏪 Local (${pedidosLocal} pedidos)</span>
            <span>${100 - pctWpp}%</span>
          </div>
          <div class="barra"><div class="barra-fill" style="width:${100 - pctWpp}%;background:linear-gradient(90deg,#b07a00,#ffd700)"></div></div>
        </div>
      </div>

      <!-- CLIENTES PARA REACTIVAR -->
      ${clientesSinComprar && clientesSinComprar.length > 0 ? `
      <div class="seccion">
        <div class="seccion-title">🔴 Clientes para reactivar</div>
        ${clientesSinComprar.map(c => {
          const dias = Math.floor((Date.now() - new Date(c.ultima_compra_en)) / (1000 * 60 * 60 * 24));
          return `
          <div class="lista-item">
            <div>
              <div class="lista-nombre">${c.nombre || 'Sin nombre'}</div>
              <div class="lista-sub">${c.telefono}</div>
            </div>
            <span class="lista-badge badge-rojo">${dias} días</span>
          </div>`;
        }).join('')}
      </div>` : `
      <div class="seccion">
        <div class="seccion-title">✅ Retención de clientes</div>
        <div class="empty">Todos tus clientes compraron en los últimos 7 días 🎉</div>
      </div>`}

      <!-- TOP PRODUCTOS -->
      ${topProd.length > 0 ? `
      <div class="seccion">
        <div class="seccion-title">🏆 Productos más vendidos</div>
        ${topProd.map(([nombre, cantidad], i) => `
        <div class="lista-item">
          <div class="lista-nombre">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '  '} ${nombre}</div>
          <div class="lista-valor">${Math.round(cantidad)} kg/u</div>
        </div>`).join('')}
      </div>` : ''}

      <!-- ÚLTIMOS PEDIDOS -->
      ${ultimosPedidos && ultimosPedidos.length > 0 ? `
      <div class="seccion">
        <div class="seccion-title">🕐 Últimos pedidos</div>
        ${ultimosPedidos.map(p => {
          const fecha = new Date(p.creado_en).toLocaleString('es-UY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
          return `
          <div class="lista-item">
            <div>
              <div class="lista-nombre">${p.clientes?.nombre || 'Cliente'}</div>
              <div class="lista-sub">${fecha} · ${p.canal === 'whatsapp' ? '💬 WhatsApp' : '🏪 Local'}</div>
            </div>
            <div class="lista-valor">${formatPesos(p.total)}</div>
          </div>`;
        }).join('')}
      </div>` : ''}

      <!-- RESUMEN DEL MES -->
      <div class="seccion">
        <div class="seccion-title">📅 Resumen del mes</div>
        <div class="lista-item">
          <div class="lista-nombre">Facturación total</div>
          <div class="lista-valor">${formatPesos(facturacionMes)}</div>
        </div>
        <div class="lista-item">
          <div class="lista-nombre">Total pedidos</div>
          <div class="lista-valor">${pedidosMesN}</div>
        </div>
        <div class="lista-item">
          <div class="lista-nombre">Clientes activos</div>
          <div class="lista-valor">${clientesActivosSemana}</div>
        </div>
        <div class="lista-item">
          <div class="lista-nombre">Total registrados</div>
          <div class="lista-valor">${totalClientes}</div>
        </div>
      </div>

      <div style="text-align:center;padding:16px 0;">
        <button class="btn-refresh" onclick="cargarDashboard()">🔄 Actualizar datos</button>
        <div style="font-size:11px;color:#4a6a4a;margin-top:8px;">Última actualización: ${new Date().toLocaleTimeString('es-UY')}</div>
      </div>
    `;

  } catch (error) {
    console.error('Error:', error);
    document.getElementById('contenido').innerHTML = `
      <div class="seccion">
        <div class="seccion-title">❌ Error de conexión</div>
        <div class="empty">No se pudo conectar a la base de datos.<br>Verificá tu conexión a internet.</div>
        <div style="text-align:center;margin-top:12px;">
          <button class="btn-refresh" onclick="cargarDashboard()">🔄 Reintentar</button>
        </div>
      </div>`;
  }
}

// Cargar al inicio
cargarDashboard();

// Auto-actualizar cada 5 minutos
setInterval(cargarDashboard, 5 * 60 * 1000);
</script>

</body>
</html>
